[project]
name = "nyaya-rakshak-backend"
version = "1.0.0"
description = "AI Legal Clarity, Verification & Action Navigator - India First"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
